name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            lti-tester-react/package-lock.json
            istation-data-tool/package-lock.json

      - name: Install & build LTI Tester
        run: npm ci && npm run build
        working-directory: lti-tester-react

      - name: Install & build Istation Data Tool
        run: npm ci && npm run build
        working-directory: istation-data-tool

      - name: Merge build outputs
        run: |
          mkdir -p combined-dist/lti-tester combined-dist/istation-tool
          cp -r lti-tester-react/dist/. combined-dist/lti-tester/
          cp -r istation-data-tool/dist/. combined-dist/istation-tool/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
